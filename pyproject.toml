[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netagent"
version = "2.3.0"
description = "NetAgent: Autonomous AI network forensic, packet capture, threat-hunting & analysis agent with sandboxing and memory."
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "ollama>=0.4.0",
    "httpx>=0.24.0",
    "questionary>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "click>=8.1",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.scripts]
netagent = "wireshark_mcp.cli:main"
wireshark-agent = "wireshark_mcp.cli:main"

[tool.setuptools]
packages = ["wireshark_mcp"]
